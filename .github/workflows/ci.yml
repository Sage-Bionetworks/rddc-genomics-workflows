name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.pipeline }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pipeline: [fastq-qc, report-findings]
        # stub checks the wiring quickly; full runs the tools in Docker on the test data
        mode: [stub, full]
        include:
          - pipeline: fastq-qc
            target: fastq
          - pipeline: report-findings
            target: rf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Nextflow at the version pinned in the Makefile (NXF_VERSION); pin to Cirro's supported
      # version once it is known.
      - name: Nextflow
        run: make tools

      - name: Lint
        if: matrix.mode == 'stub'
        run: .tools/nextflow lint pipelines/${{ matrix.pipeline }}/main.nf modules subworkflows

      - name: Run
        run: make ${{ matrix.target }}-${{ matrix.mode == 'stub' && 'stub' || 'test' }}

  rddc-reports:
    name: rddc-reports (unit tests, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-image-tags
      - run: make py-test

  preprocess:
    name: preprocess.py syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile pipelines/*/.cirro/preprocess.py
